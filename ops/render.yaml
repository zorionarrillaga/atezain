# Render blueprint, free plan (PLAN.md §4.5). Deployed 2026-09-02 on the owner's written word that
# day (CLAUDE.md rule 1): service `atezain`, Frankfurt, beside the Neon database. The account, the
# click and the keys are his. Every secret below is set in the dashboard and appears in no file in
# this repository. What is live is read at /healthz, not here — the dashboard's values win over
# this file's defaults, and one flip was once reported saved when it was not (STATUS.md).
services:
  - type: web
    name: atezain
    runtime: docker
    plan: free
    dockerfilePath: ./ops/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false        # a push is not a deploy. CLAUDE.md rule 1 says a deploy needs the
                             # owner's word, that day; with autoDeploy on, every commit would be
                             # one. Deploys are triggered by hand from the dashboard.
    envVars:
      - key: ATEZAIN_ADAPTER
        value: invoices-es
      - key: ATEZAIN_STATE_DIR
        value: /app/var
      - key: ATEZAIN_MODEL
        value: stub            # the blueprint's default; the live service was flipped to `groq`
                               # in the dashboard on 2026-09-02 (verified at /healthz). A visitor
                               # may always bring their own key with the X-Groq-Key header
      - key: DATABASE_URL      # Neon, free tier: the records, the queue, the chain, the held graph
        sync: false            # and the session table, one schema per session (PLAN.md §4.1, §4.2).
                               # Without it the service runs on its own disk-backed SQLite, which
                               # Render's free plan does not persist across a spin-down
      - key: GROQ_API_KEY
        sync: false
      - key: ATEZAIN_OWNER_TOKEN   # clears the SERVER's model budget fuse; nothing else
        sync: false
      # NO LANGFUSE_* HERE, and that is the decision, not an omission (✋ 2026-09-03). Tracing
      # (PLAN.md §4.5, `agent/tracing.py`) records the model call: what it was shown and what it
      # answered. On this service that input is a stranger's uploaded rows — possibly real invoices
      # and real customers — and sending them to a third party is not something a visitor to a demo
      # agreed to. `Tracer.from_env` turns the hosted view on when it finds the two keys, so leaving
      # them declared here is what would let a filled-in dashboard field ship that data silently.
      # `tests/test_api.py::test_the_blueprint_declares_no_tracing_key` holds this file to it.
