name: Verify supervised collections candidate
# Deliberately manual: preparing this workflow does not connect or activate a build service.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atezain
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: atezain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atezain -d atezain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the constrained environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r ops/requirements-dev.txt
          .venv/bin/pip check
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Verify both stores
        env:
          ATEZAIN_TEST_DSN: postgresql://atezain:disposable-test-password@localhost:5432/atezain_test
        run: make test
      - name: Run every local gate
        run: make all
      - name: Exercise the candidate workload
        run: .venv/bin/python -m ops.workload --output ops/workload-result.json
      - name: Build the runtime image
        run: docker build -f ops/Dockerfile -t atezain:verification .
