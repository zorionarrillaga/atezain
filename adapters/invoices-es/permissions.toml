# atezain adapter: overdue-invoice follow-up, Spanish.
# This file is the whole of what the agent may propose. It is DATA. The model never sees it as an
# instruction it could be talked out of; the policy service checks each proposal against it after
# the model has spoken.

[meta]
adapter = "invoices-es"
lang = "es"
version = 1

[budget]
daily_writes = 20            # proposals that are not denied, per day; reaching it trips the fuse.
                             # A human's REJECTED counts: a budget the agent refills by getting
                             # rejected is not a limit. Only a policy denial is free.

[records]                    # every action names a record type; a record_id must fullmatch its pattern
invoice = '^F-\d{4}-\d{3}$'

[actions.send_reminder]      # draft a reminder and, if a human approves, send it
record = "invoice"
writes = ["reminder_text", "reminder_channel", "reminder_to"]
approval = "required"
daily_max = 10
[actions.send_reminder.constraints]
reminder_channel = ["email"]
[actions.send_reminder.record_constraints]
# WHERE a reminder goes is not the assistant's to choose. `reminder_to` must equal the record's own
# `contact` — the address the customer's own system loaded, which no action here may write — and a
# record that carries no contact has no address to be sent to, so naming one is refused. Client
# simulation 1 (STATUS.md) is why: an email in the record asked for the reminders to go to another
# address, and the assistant repeated the request in its recommendation.
reminder_to = "contact"

[actions.update_status]
record = "invoice"
writes = ["status"]
approval = "required"
[actions.update_status.constraints]
status = ["reminded", "promised", "disputed"]

[actions.add_note]           # a non-consequential write: auto-approved, still audited
record = "invoice"
writes = ["note"]
approval = "none"

[actions.update_amount]      # never. An amount is money.
record = "invoice"
deny = true

[actions.delete_invoice]     # never.
record = "invoice"
deny = true

[actions.send_to_external]   # never: no data leaves to an address the policy does not know
record = "invoice"
deny = true
